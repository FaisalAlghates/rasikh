name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4 # Firebase emulators need a JRE
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: npm i -g firebase-tools
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Unit + security-rules tests (Firebase emulators)
        run: pnpm test
      - name: Web e2e (Playwright + emulators)
        run: |
          pnpm --filter @rasikh/web exec playwright install --with-deps chromium
          firebase emulators:exec --only auth,functions,firestore,storage --project demo-rasikh "pnpm --filter @rasikh/web e2e"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emulator-logs
          path: '**/*-debug.log'

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test