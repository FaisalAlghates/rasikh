name: Demo (GitHub Pages)

# The free, static demo of the public site: https://faisalalghates.github.io/rasikh/
# Sign-in and saving are off in it (no backend); pages, map schematic, design lab, sections and videos work.
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rasikh/shared build
      - run: pnpm --filter @rasikh/web build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/.next-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
